<!doctype html>
<html lang="es">
  <body style="margin:0;background:#100E0C;color:#F4ECE2;font-family:Georgia,'Times New Roman',serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#100E0C">
      <tr>
        <td align="center" style="padding:48px 24px">
          <p style="margin:0 0 24px;letter-spacing:.2em;text-transform:uppercase;color:#C9A96E;font-size:12px;font-family:Georgia,serif">Audite</p>
          <h1 style="margin:0 0 12px;font-weight:400;font-size:36px;line-height:1.15;color:#F4ECE2">Tu acceso</h1>
          <p style="margin:0 0 28px;font-size:16px;line-height:1.5;color:#B7AB9C">Para entrar en la app, pulsa el botón o escribe el código.</p>
          <p style="margin:0 0 32px">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#C9A96E;color:#100E0C;text-decoration:none;border-radius:999px;padding:14px 28px;font-size:16px">Entra en Audite</a>
          </p>
          <p style="margin:0 0 8px;font-size:14px;color:#B7AB9C">O escribe este código en la app:</p>
          <p style="margin:0 0 28px;font-size:32px;letter-spacing:.28em;color:#F4ECE2;font-family:Georgia,serif">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;color:#8A8175">Caduca pronto. Si no has sido tú, puedes ignorar este correo.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
